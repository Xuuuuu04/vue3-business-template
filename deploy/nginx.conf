map "$status:$uri" $frontend_cache_control {
    default "no-store";
    "~^(200|206|304):/assets/[^/]+-[A-Za-z0-9_-]{8,}[.](js|css|woff2?|ttf|otf|svg|png|jpe?g|gif|webp|avif|ico)$"
        "public, max-age=31536000, immutable";
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    client_max_body_size 12m;

    add_header Cache-Control $frontend_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_ignore_headers X-Accel-Buffering;
    proxy_cache off;
    proxy_next_upstream off;
    proxy_read_timeout 300s;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;

    location = /api {
        gzip off;
        proxy_pass http://127.0.0.1:8000;
    }
    location ^~ /api/ {
        gzip off;
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ (^|/)[.] { return 404; }
    location ~* [.]map$ { return 404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
